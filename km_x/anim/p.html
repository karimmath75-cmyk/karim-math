<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>عرض متحرك – Karim Math</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f172a;--panel:#13304a;--card:#1c4560;--yel:#f5c34f;--txt:#f1f5f9;--mut:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'Cairo',sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:auto;background:linear-gradient(rgba(148,163,184,.08) 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,rgba(148,163,184,.08) 1px,transparent 1px) 0 0/40px 40px,var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px}
header h1{font-size:15px;font-weight:600;color:#cbd5e1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{background:var(--yel);color:#1e293b;border:0;border-radius:14px;padding:6px 12px;font:800 14px 'Cairo';cursor:pointer;flex:none}
.bars{display:flex;gap:6px;padding:4px 16px 0}.bars i{flex:1;height:5px;border-radius:4px;background:#334155;transition:background .4s}.bars i.on{background:var(--yel)}.bars i.done{background:#8a7a3e}
.meta{display:flex;align-items:center;justify-content:space-between;padding:8px 16px}.cnt{color:var(--mut);font-size:16px}
.tag{background:rgba(245,195,79,.15);color:var(--yel);border-radius:20px;padding:3px 14px;font-weight:800;font-size:15px}
#stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:6px 16px;min-height:0}
.sv{width:100%;height:100%;flex:1 1 0;min-height:120px;animation:pop .4s ease both}
.box{width:100%;background:var(--card);border:1.5px solid #2b5878;border-radius:18px;padding:10px 14px;text-align:center;font-size:19px;font-weight:600;animation:pop .45s ease both}.box b{color:var(--yel)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.fd{animation:fdk .6s ease both}@keyframes fdk{from{opacity:0}to{opacity:1}}
.dr{stroke-dasharray:420;stroke-dashoffset:420;animation:drk 1.2s ease forwards}@keyframes drk{to{stroke-dashoffset:0}}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 3px;font-size:.9em;direction:ltr}.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.sheet{background:var(--panel);border-radius:30px 30px 0 0;padding:16px 18px 12px;min-height:36%;display:flex;flex-direction:column}
.sheet h2{font-size:22px;font-weight:800;margin-bottom:8px}
.lines{flex:1;display:flex;flex-direction:column;gap:8px;overflow:auto}
.line{border-right:4px solid var(--yel);padding:2px 12px 2px 0;font-size:17px;line-height:1.75;animation:pop .4s ease both}.line.old{border-color:#475569;color:var(--mut)}.line b{color:var(--yel)}
.nav{display:flex;gap:12px;margin-top:10px}
.next{flex:1;background:var(--yel);color:#1e293b;border:0;border-radius:22px;padding:11px;font:800 19px 'Cairo';cursor:pointer}
.prev{width:64px;background:none;border:2px solid #2b5878;border-radius:22px;color:var(--txt);font-size:24px;cursor:pointer}.prev:disabled{opacity:.3}
.lock{position:absolute;inset:0;background:rgba(15,23,42,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center}.lock.show{display:flex}
.brand{font-size:12px;color:#64748b;text-align:center;padding-top:6px;direction:ltr}
</style></head><body>
<div id="app">
 <header><h1 id="h1"></h1><span><button class="hb" onclick="location.href='../anim.html'">☰ العروض</button> <button class="hb" onclick="try{parent.kmxClose()}catch(e){history.back()}">✕</button></span></header>
 <div class="bars" id="bars"></div>
 <div class="meta"><span class="cnt" id="cnt"></span><span class="tag" id="tag"></span></div>
 <div id="stage"></div>
 <div class="sheet"><h2 id="title"></h2><div class="lines" id="lines"></div>
  <div class="nav"><button class="prev" id="prev">›</button><button class="next" id="next"></button></div><div class="brand">Karim Math</div></div>
 <div class="lock" id="lock"><div style="font-size:44px">🔒</div><div style="font-size:20px;font-weight:800">بقية الشرح للمشتركين</div>
  <button class="next" style="flex:none;width:220px" id="unlock">🔑 تفعيل الاشتراك</button><button class="prev" style="width:220px" onclick="i=0;step=0;render()">↩ العودة للبداية</button></div>
</div>
<script src="p.js"></script><script>addEventListener("hashchange",()=>location.reload())</script>
<script>
const id=(location.hash||'#circle').slice(1),D=P[id]||P.circle,S=D.S;
const LV={1:'1 متوسط',2:'2 متوسط',3:'3 متوسط',4:'4 متوسط'};
let i=0,step=0;const $=x=>document.getElementById(x);
function PA(){try{return window.parent!==window?window.parent:null}catch(e){return null}}
function isLk(){try{const k=PA().__km20;return k.closed()&&(k.cfg.locked||[]).includes('sol')}catch(e){return false}}
const unlocked=!isLk();
$('h1').textContent='🎞️ '+D.name+' ('+LV[D.lv]+')';document.title=D.name+' – Karim Math';
$('bars').innerHTML=S.map(()=>'<i></i>').join('');
function render(){const s=S[i];$('lock').classList.toggle('show',!!(s.locked&&!unlocked));
 [...$('bars').children].forEach((b,k)=>b.className=k<i?'done':k===i?'on':'');
 $('cnt').textContent=`${S.length} / ${i+1}`;$('tag').textContent=s.tag;$('title').innerHTML=s.title;
 {const sh=s.vis.slice(0,step+1),svs=sh.filter(v=>v.startsWith('<svg'));const sv=svs.length?svs[svs.length-1]:'';$('stage').innerHTML=sv+sh.filter(v=>!v.startsWith('<svg')).join('');}
 const n=step+1;$('lines').innerHTML=s.lines.slice(0,n).map((t,k)=>`<div class="line${k<n-1?' old':''}">${t}</div>`).join('');
 $('next').innerHTML=step>=s.lines.length-1?(i===S.length-1?'↺ إعادة العرض':'التالي ‹'):'الخطوة التالية ‹';$('prev').disabled=i===0&&step===0}
function next(){if(step<S[i].lines.length-1)step++;else if(i<S.length-1){i++;step=0}else{i=0;step=0}render()}
function prev(){if(step>0)step--;else if(i>0){i--;step=S[i].lines.length-1}render()}
$('next').onclick=next;$('prev').onclick=prev;$('unlock').onclick=()=>{try{PA().kmAct();PA().kmxClose&&PA().kmxClose()}catch(e){}};
document.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key===' ')next();if(e.key==='ArrowRight')prev()};
let x0=null;document.addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)(dx<0?next:prev)();x0=null},{passive:true});
render();
</script></body></html>
