<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مولّد الفروض والاختبارات – Karim Math</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f172a;--pan:#16223a;--card:#1c2b47;--line:#2c3e60;--yel:#f5c34f;--txt:#e2e8f0;--mut:#94a3b8;--blue:#2563eb}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,sans-serif;color:var(--txt);background:var(--bg);
 background-image:linear-gradient(rgba(148,163,184,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.07) 1px,transparent 1px);background-size:36px 36px}
header{position:sticky;top:0;z-index:5;background:#0b1222;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{margin:0;font-size:17px;font-weight:800}
header h1 span{color:var(--yel)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
button{font-family:Cairo;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);padding:7px 12px;font-size:14px;font-weight:600}
button.pri{background:var(--yel);color:#1e293b;border:0}
button.blue{background:var(--blue);border:0;color:#fff}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#0b1222cc;position:sticky;top:55px;z-index:4}
.tabs button{white-space:nowrap;border-radius:20px}
.tabs button.on{background:var(--yel);color:#1e293b;border-color:var(--yel)}
main{max-width:860px;margin:auto;padding:12px}
.card{background:var(--pan);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:18px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
input,select,textarea{width:100%;font:15px Cairo;background:#0d1729;color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
textarea{min-height:110px;direction:rtl;line-height:1.7}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:8px;align-items:center;margin:8px 0;color:var(--txt)}
.chk input{width:20px;height:20px}
.ex{border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.ex .hd{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--card)}
.ex .hd b{flex:1}
.ex .bd{padding:10px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{border-radius:20px;font-size:13px;padding:5px 11px}
.hint{font-size:12.5px;color:var(--mut);line-height:1.7}
.hint code{background:#0d1729;padding:1px 6px;border-radius:6px;color:var(--yel);direction:ltr;display:inline-block}
.bottom{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 12px;background:#0b1222;border-top:1px solid var(--line)}
.bottom button{padding:11px;font-size:17px;font-weight:800}
.bottom button.on{background:var(--yel);color:#1e293b;border:0}
#prevWrap{display:none;padding:12px;overflow:auto}
.zoom{display:flex;gap:6px;align-items:center;justify-content:center;margin-bottom:10px}
.sheet{width:794px;min-height:1123px;margin:0 auto 18px;background:#fff;color:#000;padding:44px 52px;font-family:'Times New Roman',Amiri,serif;transform-origin:top center;box-shadow:0 6px 30px #0008;position:relative}
.sheet .c{text-align:center;font-weight:700;line-height:1.5}
.hdr{display:flex;justify-content:space-between;font-weight:700;margin-top:10px;line-height:1.7}
.ttl{border:1.5px solid #000;border-radius:6px;text-align:center;font-weight:700;padding:4px;margin:10px 0}
.nm{display:flex;justify-content:space-between;border-top:1.5px solid #000;padding-top:6px;margin-bottom:6px}
.calc{text-align:center;font-style:italic;font-size:.85em;margin-bottom:6px}
.exh{font-weight:700;text-decoration:underline;margin:14px 0 6px}
.q{margin:4px 22px 4px 0}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px;font-size:.92em}
.fr>span:first-child{border-bottom:1.2px solid #000;padding:0 2px}
.sq{border-top:1.2px solid #000;padding:0 1px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.foot{position:absolute;bottom:30px;left:52px;right:52px;text-align:center;font-weight:700;border-top:1px solid #000;padding-top:6px}
.sol table{width:100%;border-collapse:collapse;margin:6px 0 12px}
.sol td,.sol th{border:1px solid #000;padding:4px 8px;vertical-align:top}
.sol th{background:#eee}
.framed{outline:2px solid #000;outline-offset:-22px}
@media print{
 header,.tabs,main,.bottom,.zoom{display:none!important}
 body{background:#fff}
 #prevWrap{display:block!important;padding:0}
 .sheet{transform:none!important;box-shadow:none;margin:0;page-break-after:always}
 @page{size:A4;margin:0}
}
</style>
</head>
<body>
<header>
 <h1>مولّد الفروض والاختبارات <span>Karim Math</span></h1>
 <div class="tools"><button class="blue" onclick="doPrint()">طباعة / PDF</button><button onclick="toWord()">Word</button></div>
</header>
<div class="tabs" id="tabs"></div>
<main id="editor"></main>
<div id="prevWrap">
 <div class="zoom"><button onclick="zoom(-.1)">−</button><span id="zv"></span><button onclick="zoom(.1)">+</button><button onclick="fitZoom()">ملاءمة</button></div>
 <div id="sheets"></div>
</div>
<div class="bottom"><button id="bSet" class="on" onclick="mode('set')">الإعدادات</button><button id="bPrev" onclick="mode('prev')">المعاينة</button></div>

<script>
// ===== المواضيع حسب المستوى =====
const TOPICS={
'السنة الأولى متوسط':['الأعداد الطبيعية والأعداد العشرية','القسمة الإقليدية والقسمة العشرية','الكتابات الكسرية','الأعداد النسبية','الحساب الحرفي والمعادلات','التناسبية','المستقيمات المتوازية والمتعامدة','الزوايا','التناظر المحوري','المحيطات والمساحات','متوازي المستطيلات'],
'السنة الثانية متوسط':['العمليات على الأعداد العشرية وأولوية الحساب','الكسور (جمع، طرح، ضرب)','الأعداد النسبية','الحساب الحرفي والمعادلات','التناسبية والنسب المئوية','تنظيم معطيات','التناظر المركزي','الزوايا والمستقيمات المتوازية','المثلث ومتوازي الأضلاع','الموشور القائم والأسطوانة'],
'السنة الثالثة متوسط':['الأعداد النسبية (ضرب وقسمة)','الأعداد الناطقة والكسور','القوى ذات الأسس الصحيحة','الحساب الحرفي والمعادلات','المتراجحات','التناسبية والسرعة','الإحصاء','مستقيم المنتصفين','تناسبية الأطوال','تقايس المثلثات','المثلث القائم والدائرة','خاصية فيثاغورس','جيب تمام زاوية حادة','الانسحاب','الهرم والمخروط'],
'السنة الرابعة متوسط':['الأعداد الطبيعية والقاسم المشترك الأكبر','الجذور التربيعية','الحساب الحرفي','المعادلات والمتراجحات','جمل معادلتين','الدوال الخطية والتآلفية','الإحصاء','خاصية طالس وعكسها','حساب المثلثات','الأشعة والانسحاب','المعالم','الزوايا المركزية والمحيطية','الهرم والمخروط','الكرة والجلة']};
const ORD=['الأول','الثاني','الثالث','الرابع','الخامس','السادس'];
const AIS={ChatGPT:'https://chatgpt.com/',Gemini:'https://gemini.google.com/app',DeepSeek:'https://chat.deepseek.com/',Qwen:'https://chat.qwen.ai/',Claude:'https://claude.ai/new'};

// ===== الحالة =====
const DEF={h:{wil:'',school:'',year:'2026/2027',level:'السنة الثالثة متوسط',dur:'ساعتان',type:'اختبار الفصل الأول في مادة الرياضيات',nameBox:true,sol:true,calc:true,frame:false,end:'انتهى – بالتوفيق',font:17,lh:1.7},
 ex:[{title:'',topic:'الأعداد الناطقة والكسور',pts:6,isSit:false,q:'احسب A = frac(2,3) + frac(5,6) × frac(3,10) واكتب النتيجة على شكل كسر غير قابل للاختزال.\nاكتب B = sqrt(50) - sqrt(8) + sqrt(2) على الشكل a sqrt(2) حيث a عدد طبيعي.',sol:'A = frac(2,3) + frac(1,4) = frac(11,12) || 2\nB = 5sqrt(2) - 2sqrt(2) + sqrt(2) = 4sqrt(2) || 2'},
  {title:'',topic:'المعادلات والمتراجحات',pts:6,isSit:false,q:'حلّ المعادلة: 3x - 5 = 2x + 7\nحلّ المتراجحة: 2x + 3 <= 11 ثم مثّل حلولها على مستقيم مدرّج.',sol:'x = 12 || 2\nx <= 4 || 2'},
  {title:'',topic:'تبليط قاعة',pts:8,isSit:true,q:'يريد عمّ سالم تبليط أرضية قاعة مستطيلة الشكل طولها 7,2 m وعرضها 4,8 m ببلاطات مربعة متماثلة دون قصّ.\nما هو أكبر طول ممكن لضلع البلاطة؟ وكم بلاطة يحتاج؟',sol:'PGCD(720 ; 480) = 240 cm || 4\n(720 ÷ 240) × (480 ÷ 240) = 3 × 2 = 6 بلاطات || 4'}],
 ai:{n:3,total:20,sit:true,topics:'',extra:''}};
let S;try{S=JSON.parse(localStorage.getItem('km_exam'))}catch(e){}
if(!S)S=JSON.parse(JSON.stringify(DEF));
let tab='info',Z=1;
function save(){try{localStorage.setItem('km_exam',JSON.stringify(S))}catch(e){}}

// ===== تحويل الرموز =====
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function conv(s){
 s=esc(s).replace(/&lt;=/g,'≤').replace(/&gt;=/g,'≥').replace(/!=/g,'≠').replace(/\*/g,'×').replace(/(\d)\.(\d)/g,'$1,$2');
 for(let k=0;k<4;k++){
  s=s.replace(/frac\(([^(),]*(?:\([^()]*\))?[^(),]*),([^()]*(?:\([^()]*\))?[^()]*)\)/g,'<span class="fr"><span>$1</span><span>$2</span></span>');
  s=s.replace(/sqrt\(([^()]*)\)/g,'√<span class="sq">$1</span>');
 }
 return s.replace(/\^(\-?\w+)/g,'<sup>$1</sup>');
}
function math(raw){
 const re=/[A-Za-z0-9(√][A-Za-z0-9()=+\-*\/^<>!,.;:\s%°×÷√|']*[A-Za-z0-9)²³']|[A-Za-z0-9]/g;
 let out='',i=0,m;
 while((m=re.exec(raw))){out+=esc(raw.slice(i,m.index))+'<span class="ltr">'+conv(m[0])+'</span>';i=m.index+m[0].length}
 return out+esc(raw.slice(i));
}

// ===== الواجهة =====
const TABS=[['info','📋 معلومات الاختبار'],['ex','✏️ التمارين والتصحيح'],['ai','🤖 المساعد الذكي'],['tpl','🎨 القالب'],['files','📁 اختباراتي']];
function drawTabs(){document.getElementById('tabs').innerHTML=TABS.map(([k,t])=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';drawTabs();draw()">${t}</button>`).join('')}
const f=(lbl,key,ph='')=>`<div><label>${lbl}</label><input value="${esc(S.h[key]??'')}" placeholder="${ph}" oninput="S.h.${key}=this.value;save()"></div>`;
const c=(lbl,key)=>`<label class="chk"><input type="checkbox" ${S.h[key]?'checked':''} onchange="S.h.${key}=this.checked;save()">${lbl}</label>`;
function draw(){
 const E=document.getElementById('editor');let h='';
 if(tab==='info'){
  h=`<div class="card"><h2>الترويسة</h2><div class="row">${f('مديرية التربية لولاية','wil','اتركها فارغة للنقاط')}${f('السنة الدراسية','year')}</div>
  ${f('المؤسسة','school','اتركها فارغة للنقاط')}
  <div class="row"><div><label>المستوى</label><select onchange="S.h.level=this.value;save()">${Object.keys(TOPICS).map(l=>`<option ${l===S.h.level?'selected':''}>${l}</option>`).join('')}</select></div>${f('المدة','dur')}</div>
  ${f('عنوان الاختبار','type')}</div>
  <div class="card"><h2>خيارات الورقة</h2>${c('خانة الاسم واللقب والقسم','nameBox')}${c('صفحة التصحيح النموذجي وسلّم التنقيط','sol')}${c('عبارة «يُسمح باستعمال الآلة الحاسبة غير المبرمجة»','calc')}${f('عبارة الختام','end')}</div>`;
 }
 if(tab==='ex'){
  h=`<div class="card"><p class="hint">اكتب كل سؤال في سطر. الرموز: <code>frac(2,3)</code> كسر، <code>sqrt(50)</code> جذر، <code>x^2</code> قوة، <code>&lt;=</code> و <code>&gt;=</code> للمتراجحات، <code>*</code> للضرب. في سلّم التنقيط اكتب: <code>عنصر الإجابة || العلامة</code></p></div>`;
  S.ex.forEach((e,i)=>{h+=`<div class="ex"><div class="hd"><b>${e.isSit?'الوضعية الإدماجية':'التمرين '+ORD[i]}</b><button onclick="mv(${i},-1)">↑</button><button onclick="mv(${i},1)">↓</button><button style="color:#f87171" onclick="S.ex.splice(${i},1);save();draw()">حذف</button></div><div class="bd">
   <div class="row"><div><label>الموضوع</label><input value="${esc(e.topic)}" oninput="S.ex[${i}].topic=this.value;save()"></div><div><label>العلامة</label><input type="number" step=".5" value="${e.pts}" oninput="S.ex[${i}].pts=+this.value;save()"></div></div>
   <label class="chk"><input type="checkbox" ${e.isSit?'checked':''} onchange="S.ex[${i}].isSit=this.checked;save();draw()">وضعية إدماجية</label>
   <label>${e.isSit?'نص الوضعية والأسئلة':'الأسئلة (سؤال في كل سطر)'}</label><textarea oninput="S.ex[${i}].q=this.value;save()">${esc(e.q)}</textarea>
   <label>سلّم التنقيط (عنصر الإجابة || العلامة)</label><textarea style="min-height:80px" oninput="S.ex[${i}].sol=this.value;save()">${esc(e.sol)}</textarea></div></div>`});
  h+=`<button class="pri" style="width:100%;padding:11px" onclick="S.ex.push({title:'',topic:'',pts:4,isSit:false,q:'',sol:''});save();draw()">＋ إضافة تمرين</button>
  <p class="hint" style="text-align:center">مجموع العلامات الحالي: <b>${S.ex.reduce((a,e)=>a+(+e.pts||0),0)}</b> / 20</p>`;
 }
 if(tab==='ai'){
  const tp=TOPICS[S.h.level]||[];
  h=`<div class="card"><h2>توليد اختبار كامل مع التصحيح وسلّم التنقيط</h2><p class="hint">بدون مفاتيح ولا اشتراك: انسخ الطلب، والصقه في أي محادثة ذكاء اصطناعي، ثم الصق الرد هنا فيملأ البرنامج الاختبار تلقائيًا.</p></div>
  <div class="card"><h2>إعدادات التوليد</h2><div class="row"><div><label>عدد التمارين</label><input type="number" value="${S.ai.n}" oninput="S.ai.n=+this.value;save()"></div><div><label>مجموع العلامات</label><input type="number" value="${S.ai.total}" oninput="S.ai.total=+this.value;save()"></div></div>
  <label class="chk"><input type="checkbox" ${S.ai.sit?'checked':''} onchange="S.ai.sit=this.checked;save()">آخرها وضعية إدماجية</label>
  <label>الدروس المستهدفة (كل موضوع في سطر) – ${S.h.level}</label><textarea id="aiT" oninput="S.ai.topics=this.value;save()" placeholder="اختر من الأزرار أسفله">${esc(S.ai.topics)}</textarea>
  <div class="chips">${tp.map(t=>`<button onclick="addT('${t}')">＋ ${t}</button>`).join('')}</div>
  <label>تعليمات إضافية (اختياري)</label><input value="${esc(S.ai.extra)}" placeholder="مثال: أسئلة متدرجة، أعداد بسيطة" oninput="S.ai.extra=this.value;save()"></div>
  <div class="card"><h2>① انسخ الطلب وافتح المحادثة</h2><button class="pri" style="width:100%;padding:11px" onclick="copyP('ChatGPT')">نسخ الطلب وفتح ChatGPT</button>
  <div class="chips">${['Gemini','DeepSeek','Qwen','Claude'].map(a=>`<button onclick="copyP('${a}')">${a}</button>`).join('')}<button onclick="copyP()">نسخ فقط</button><button onclick="showP()">عرض الطلب</button></div><pre id="pv" style="display:none;white-space:pre-wrap;font-size:12px;background:#0d1729;padding:10px;border-radius:12px;margin-top:8px"></pre></div>
  <div class="card"><h2>② الصق ردّ المحادثة هنا</h2><textarea id="resp" placeholder="الصق الرد (كاملاً) هنا..."></textarea>
  <div class="chips"><button onclick="pasteC()">لصق من الحافظة</button><button onclick="document.getElementById('fl').click()">ملف md / txt</button><input id="fl" type="file" accept=".txt,.md,.json" hidden onchange="readF(this)"></div>
  <button class="blue" style="width:100%;padding:11px;margin-top:10px" onclick="applyR()">تطبيق على الاختبار</button><p class="hint" id="msg"></p></div>`;
 }
 if(tab==='tpl'){
  h=`<div class="card"><h2>الخط والمظهر</h2><label>حجم الخط: <b>${S.h.font}</b></label><input type="range" min="13" max="22" value="${S.h.font}" oninput="S.h.font=+this.value;save();draw()">
  <label>تباعد الأسطر: <b>${S.h.lh}</b></label><input type="range" min="1.2" max="2.4" step=".1" value="${S.h.lh}" oninput="S.h.lh=+this.value;save();draw()">
  ${c('إطار حول الصفحة','frame')}</div>`;
 }
 if(tab==='files'){
  h=`<div class="card"><h2>حفظ العمل كملف</h2><p class="hint">يُحفظ الاختبار في ملف على جهازك، ويمكنك استيراده لاحقًا لمتابعة التعديل.</p>
  <button class="pri" style="width:100%;padding:11px" onclick="dl(JSON.stringify(S),'اختبار.kmexam','application/json')">💾 حفظ العمل كملف</button>
  <button style="width:100%;padding:11px;margin-top:8px" onclick="document.getElementById('imp').click()">📂 استيراد ملف محفوظ</button><input id="imp" type="file" hidden onchange="imp(this)">
  <button style="width:100%;padding:11px;margin-top:8px;color:#f87171" onclick="if(confirm('بدء اختبار جديد؟')){S=JSON.parse(JSON.stringify(DEF));S.ex=[];save();draw()}">🗑 اختبار جديد فارغ</button></div>`;
 }
 E.innerHTML=h;
}
function mv(i,d){const j=i+d;if(j<0||j>=S.ex.length)return;[S.ex[i],S.ex[j]]=[S.ex[j],S.ex[i]];save();draw()}
function addT(t){S.ai.topics=(S.ai.topics?S.ai.topics.trim()+'\n':'')+t;save();draw()}

// ===== المساعد الذكي =====
function prompt_(){const a=S.ai;return `أنت أستاذ رياضيات خبير في المنهاج الجزائري للتعليم المتوسط.
أنشئ ${S.h.type||'اختبارًا'} لمستوى ${S.h.level}، يتكوّن من ${a.n} تمارين${a.sit?' آخرها وضعية إدماجية':''}، مجموع علاماتها ${a.total} نقطة.
الدروس المستهدفة:
${a.topics||'دروس الفصل الحالي'}
${a.extra?'تعليمات إضافية: '+a.extra:''}
شروط: أسئلة واضحة متدرجة، نتائج عددية مضبوطة، بدون فراغات للإجابة، واحترم المنهاج الرسمي.
اكتب الرياضيات بهذه الصيغة فقط: frac(a,b) للكسر، sqrt(x) للجذر، x^2 للقوة، <= و >= للمتراجحات، * للضرب.
أعد الرد بصيغة JSON فقط داخل كتلة كود، بهذا الشكل بالضبط:
{"exercises":[{"topic":"عنوان قصير","points":6,"isSituation":false,"questions":["سؤال 1","سؤال 2"],"solution":[["عنصر الإجابة",1.5],["عنصر الإجابة",1]]}]}
- في الوضعية الإدماجية ضع نص السياق كأول عنصر في questions.
- مجموع علامات solution لكل تمرين يساوي points.`}
function showP(){const p=document.getElementById('pv');p.style.display='block';p.textContent=prompt_()}
async function copyP(ai){const t=prompt_();try{await navigator.clipboard.writeText(t);msg('✓ نُسخ الطلب. الصقه في المحادثة.')}catch(e){showP();msg('انسخ الطلب يدويًا من المربع.')}if(ai)window.open(AIS[ai],'_blank')}
async function pasteC(){try{document.getElementById('resp').value=await navigator.clipboard.readText()}catch(e){msg('اسمح بالوصول للحافظة أو الصق يدويًا.')}}
function readF(i){const r=new FileReader();r.onload=()=>document.getElementById('resp').value=r.result;r.readAsText(i.files[0])}
function msg(t){const m=document.getElementById('msg');if(m)m.textContent=t;else alert(t)}
function applyR(){
 let t=document.getElementById('resp').value;const m=t.match(/\{[\s\S]*\}/);
 try{const d=JSON.parse(m[0]);
  S.ex=d.exercises.map(e=>({title:'',topic:e.topic||'',pts:+e.points||0,isSit:!!e.isSituation,q:(e.questions||[]).join('\n'),sol:(e.solution||[]).map(s=>Array.isArray(s)?s[0]+' || '+s[1]:s).join('\n')}));
  save();tab='ex';drawTabs();draw();mode('prev');
 }catch(e){msg('⚠ تعذّر قراءة الرد. تأكد أنك لصقت كتلة JSON كاملة.')}
}

// ===== المعاينة =====
function paper(){
 const H=S.h,dots='..............',st=`font-size:${H.font}px;line-height:${H.lh}`;
 const head=`<div class="c">الجمهورية الجزائرية الديمقراطية الشعبية<br>وزارة التربية الوطنية</div>
 <div class="hdr"><div>مديرية التربية لولاية: ${esc(H.wil)||dots}<br>المؤسسة: متوسطة ${esc(H.school)||dots}</div><div>السنة الدراسية: ${esc(H.year)}<br>المستوى: ${esc(H.level)}<br>المدة: ${esc(H.dur)}</div></div>`;
 let p=`<div class="sheet ${H.frame?'framed':''}" style="${st}">${head}<div class="ttl">${esc(H.type)}</div>
 ${H.nameBox?`<div class="nm"><span>الاسم واللقب: ........................</span><span>القسم: ......</span><span style="border:1px solid #000;padding:0 10px">العلامة: ....... / 20</span></div>`:''}
 ${H.calc?'<div class="calc">يُسمح باستعمال الآلة الحاسبة غير المبرمجة</div>':''}`;
 let n=0;S.ex.forEach(e=>{const lab=e.isSit?'الوضعية الإدماجية':'التمرين '+ORD[n++];
  const qs=e.q.split('\n').filter(x=>x.trim());
  p+=`<div class="exh">${lab}${e.topic&&!e.isSit?': '+esc(e.topic):''} (${String(e.pts).padStart(2,'0')} نقاط)</div>`;
  if(e.isSit){p+=`<div class="q">${math(qs[0]||'')}</div>`;qs.slice(1).forEach((q,k)=>p+=`<div class="q">${k+1}- ${math(q)}</div>`)}
  else qs.forEach((q,k)=>p+=`<div class="q">${k+1}- ${math(q)}</div>`)});
 p+=`<div class="foot">${esc(H.end)}</div></div>`;
 if(H.sol){n=0;p+=`<div class="sheet sol" style="${st}"><div class="c" style="font-size:1.2em">التصحيح النموذجي وسلّم التنقيط</div><div class="c" style="font-weight:400">${esc(H.type)} – ${esc(H.level)}</div>`;
  S.ex.forEach(e=>{const lab=e.isSit?'الوضعية الإدماجية':'التمرين '+ORD[n++];
   p+=`<div class="exh">${lab} (${e.pts} ن)</div><table><tr><th>عناصر الإجابة</th><th style="width:70px">العلامة</th></tr>`+
   e.sol.split('\n').filter(x=>x.trim()).map(l=>{const [a,b]=l.split('||');return `<tr><td>${math(a)}</td><td style="text-align:center">${esc(b||'')}</td></tr>`}).join('')+'</table>'});
  p+='</div>'}
 return p;
}
function mode(m){
 const pv=m==='prev';document.getElementById('prevWrap').style.display=pv?'block':'none';
 document.getElementById('editor').style.display=document.getElementById('tabs').style.display=pv?'none':'';
 document.getElementById('bPrev').className=pv?'on':'';document.getElementById('bSet').className=pv?'':'on';
 if(pv){document.getElementById('sheets').innerHTML=paper();fitZoom()}
 scrollTo(0,0);
}
function applyZ(){document.querySelectorAll('#sheets .sheet').forEach(s=>{s.style.transform=`scale(${Z})`;s.style.marginBottom=(18-(1-Z)*1123)+'px'});document.getElementById('zv').textContent=Math.round(Z*100)+'%'}
function zoom(d){Z=Math.max(.3,Math.min(1.5,Z+d));applyZ()}
function fitZoom(){Z=Math.min(1,(innerWidth-24)/794);applyZ()}
function doPrint(){mode('prev');setTimeout(()=>{Z=1;applyZ();print();fitZoom()},300)}
let DLS=null;try{window.claude&&claude.use('downloads').then(d=>DLS=d).catch(()=>{})}catch(e){}
async function dl(data,name,type){if(DLS){try{await DLS.save({filename:name,data});return}catch(e){}}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click()}
function toWord(){const css=document.querySelector('style').textContent.replace(/@media print\{[\s\S]*$/,'');
 dl(`<html dir="rtl"><head><meta charset="utf-8"><style>${css} body{background:#fff} .sheet{width:auto;min-height:0;box-shadow:none;padding:0;transform:none} .foot{position:static;margin-top:30px}</style></head><body>${paper()}</body></html>`,'اختبار.doc','application/msword')}
function imp(i){const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();draw();alert('✓ تم الاستيراد')}catch(e){alert('ملف غير صالح')}};r.readAsText(i.files[0])}
drawTabs();draw();

/* km-trial: عدد محدود من الفروض المجانية لغير المشتركين */
(function(){
 const MAX=3;
 function P(){try{return window.parent!==window?window.parent:null}catch(e){return null}}
 function locked(){try{const k=P().__km20;return k.closed()}catch(e){return false}}
 const used=()=>{try{return +localStorage.getItem('km_trial')||0}catch(e){return 0}};
 const inc=()=>{try{localStorage.setItem('km_trial',used()+1)}catch(e){}};
 function bar(){let b=document.getElementById('kmTrial');if(!locked()){if(b)b.remove();return}
  if(!b){b=document.createElement('div');b.id='kmTrial';b.style.cssText='position:sticky;top:0;z-index:20;background:#7c2d12;color:#fff;font:800 14px Cairo,sans-serif;text-align:center;padding:7px 10px;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap';document.body.insertBefore(b,document.body.firstChild)}
  const r=Math.max(0,MAX-used());b.innerHTML=(r?'🎁 تجربة مجانية: بقي لك '+r+' من '+MAX+' فروض (طباعة أو Word)':'🔒 انتهت التجربة المجانية للمولّد')+' <button style="background:#f5c34f;color:#1e293b;border:0;border-radius:10px;padding:4px 12px;font:800 13px Cairo" onclick="kmTrialAct()">🔑 اشترك</button>'}
 window.kmTrialAct=function(){try{P().kmAct();P().kmxClose&&P().kmxClose()}catch(e){}};
 function cloud(){const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;z-index:99;background:rgba(15,23,42,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;font-family:Cairo,sans-serif;text-align:center;padding:24px';
  o.innerHTML='<div style="font-size:60px">☁️🔒</div><div style="font-size:21px;font-weight:800">استعملت الفروض المجانية الثلاثة</div><div style="color:#cbd5e1">اشترك لتولّد وتطبع فروضًا واختبارات بلا حدود</div><button style="background:#f5c34f;color:#1e293b;border:0;border-radius:14px;padding:12px 26px;font:800 18px Cairo" onclick="kmTrialAct()">🔑 تفعيل الاشتراك</button><button style="background:none;color:#cbd5e1;border:1px solid #475569;border-radius:12px;padding:8px 18px;font:700 15px Cairo" onclick="this.parentNode.remove()">رجوع</button>';document.body.appendChild(o)}
 function gate(fn){return function(){if(locked()){if(used()>=MAX){cloud();return}inc();bar()}return fn.apply(this,arguments)}}
 doPrint=window.doPrint=gate(doPrint);toWord=window.toWord=gate(toWord);
 bar();setInterval(bar,3000);
})();
</script>
